[package]
name = "selfpaint"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "SelfPaint — a modern Windows 11 Paint clone for Linux"
license = "MIT"
repository = "https://github.com/luke/selfpaint"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17"
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdue = "0.9"

[profile.release]
lto = "thin"
strip = true
