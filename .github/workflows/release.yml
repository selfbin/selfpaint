name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - run: cargo build --release --bin selfpaint
      - run: |
          mkdir -p dist
          cp target/release/selfpaint dist/
          tar -czf selfpaint-linux-x86_64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: selfpaint-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin selfpaint --target x86_64-pc-windows-msvc
      - run: |
          mkdir dist
          cp target/x86_64-pc-windows-msvc/release/selfpaint.exe dist/
          Compress-Archive -Path dist/* -DestinationPath selfpaint-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: selfpaint-windows-x86_64.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli
      - run: cargo build --release --lib --target wasm32-unknown-unknown
      - run: |
          wasm-bindgen --out-dir web/pkg --target web target/wasm32-unknown-unknown/release/selfpaint.wasm
          zip -r selfpaint-web.zip web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: selfpaint-web.zip

  release:
    needs: [linux, windows, web]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            linux/selfpaint-linux-x86_64.tar.gz
            windows/selfpaint-windows-x86_64.zip
            web/selfpaint-web.zip
